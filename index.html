<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Mastermind</title>
	<style>
		/* The canvas fills the window; without a height on html and body, 100% is resolved against
		   nothing and the canvas keeps its default height of 150px. */
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: black; }
		canvas { display: block; width: 100%; height: 100%; }
	</style>
</head>

<body>
	<canvas id="webgl"></canvas>
	<script type="text/javascript" src="Mastermind.js"></script>
</body>

</html>
