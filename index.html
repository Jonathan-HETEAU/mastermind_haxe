<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Mastermind</title>
	<!-- Sans hauteur sur html et body, le canvas garde sa hauteur par défaut (150 px) et le jeu est minuscule. -->
	<style>html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; } #webgl { width: 100%; height: 100%; }</style>
</head>

<body>

	<!-- globalEvents="1" : le jeu reçoit le clavier sans clic préalable sur le canvas. -->
	<canvas id="webgl" globalEvents="1"></canvas>
	<script type="text/javascript" src="Mastermind.js"></script>

</body>

</html>
